packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@dh/web": workspace:*
  "@dh/api": workspace:*
  "@dh/shared": workspace:*
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.104.5
  "@types/node": ^24
  hono: ^4.13.13
  phaser: ^4.2.1
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  zustand: ^5.0.16
  "@hono/zod-validator": ^0.9.1
  "@supabase/supabase-js": ^2.118.0
  zod: ^4.6.7
  "@cloudflare/workers-types": ^5.20261022.1
  wrangler: ^4.110.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
permissions:
  phaser:
    skills: true
skills:
  dirs:
    - .claude/skills
